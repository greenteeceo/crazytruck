:root {
  --blue: #1d8cff; --blue2: #0a64d6; --blueD: #0b3e8a; --ink: #11131c; --gold: #ffc61a; --orange: #ff8a1f; --red: #ff3d57; --gray: #a7afc4; --gray2: #7d86a0;
  --theme: #1d8cff; --safe-t: env(safe-area-inset-top, 0px); --safe-b: env(safe-area-inset-bottom, 0px);
  color-scheme: light;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
html, body { margin: 0; height: 100%; overflow: hidden; background: #2fb6ff; font-family: 'Fredoka', 'Arial Rounded MT Bold', system-ui, sans-serif; color: #fff; touch-action: none; overscroll-behavior: none; }
#gl { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
#ui { position: fixed; inset: 0; pointer-events: none; }
#boot { position: fixed; inset: 0; display: grid; place-items: center; background: linear-gradient(#2fb6ff, #bff0ff); font: 700 28px sans-serif; }
.screen { position: absolute; inset: 0; pointer-events: none; animation: fadein .25s ease; }
.screen > *, .overlay, .overlay * { pointer-events: auto; }
@keyframes fadein { from { opacity: 0; } }
@keyframes pop { 0% { transform: scale(.4); opacity: 0; } 70% { transform: scale(1.08); } 100% { transform: scale(1); opacity: 1; } }
@keyframes slideup { from { transform: translateY(40px); opacity: 0; } }
@keyframes bob { 50% { transform: translateY(-6px); } }
.stroke, .btn, .logo, .wtitle, .ribbon, .timer, .pos, .count, .banner, .lvtitle, .sname, .pill b { text-shadow: 0 2px 0 var(--ink), 0 -2px 0 var(--ink), 2px 0 0 var(--ink), -2px 0 0 var(--ink), 2px 2px 0 var(--ink), -2px 2px 0 var(--ink), 2px -2px 0 var(--ink), -2px -2px 0 var(--ink), 0 4px 0 var(--ink); }
svg { width: 100%; height: 100%; fill: currentColor; display: block; }
.ico { display: inline-block; width: 1.25em; height: 1.25em; filter: drop-shadow(0 2px 0 var(--ink)); }
.ico.gold { color: var(--gold); }
button { font: inherit; color: inherit; border: 0; background: none; padding: 0; cursor: pointer; }

/* buttons */
.btn { position: relative; display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 58px; padding: 0 22px; border-radius: 16px; font-size: 22px; font-weight: 700; color: #fff;
  border: 3px solid var(--ink); box-shadow: 0 0 0 3px #fff, inset 0 -7px 0 rgba(0,0,0,.22), 0 6px 0 3px rgba(0,0,0,.18); transition: transform .08s; }
.btn:active, .btn.down { transform: translateY(3px) scale(.97); }
.btn.blue { background: linear-gradient(#2f9bff, #0a6fe6); }

/* home / worlds */

.bar { flex: 1; height: 30px; border-radius: 16px; background: #0b3e8a; border: 3px solid var(--ink); box-shadow: 0 0 0 2px #fff; overflow: hidden; position: relative; }

.play { position: absolute; left: 0; right: 0; margin: auto; width: fit-content; bottom: calc(118px + var(--safe-b)); min-width: 170px; height: 76px; font-size: 32px; animation: pop .4s, bob 1.6s ease-in-out .4s infinite; }

.nav { position: absolute; left: 0; right: 0; margin: auto; bottom: calc(14px + var(--safe-b)); display: flex; border: 3px solid var(--ink); border-radius: 18px; overflow: hidden; box-shadow: 0 0 0 3px #fff, 0 6px 0 3px rgba(0,0,0,.2); width: min(94vw, 460px); }

.lv { width: min(100%, 460px); min-height: 74px; display: grid; grid-template-columns: 44px 1fr auto; grid-template-rows: auto auto; align-items: center; column-gap: 12px; padding: 8px 16px; border-radius: 18px; background: linear-gradient(#2f9bff, #0a6fe6); border: 3px solid var(--ink); box-shadow: 0 0 0 3px #fff, inset 0 -8px 0 rgba(0,0,0,.2); animation: slideup .35s backwards; text-align: left; }

.lv.lock { background: linear-gradient(#6f7894, #545c77); opacity: .9; }

.lvs { display: flex; gap: 2px; } .lvs i { width: 20px; height: 20px; color: rgba(0,0,0,.3); } .lvs i.on { color: var(--gold); filter: drop-shadow(0 1px 0 var(--ink)); }

/* HUD */

.lvname { font-size: 15px; font-weight: 600; opacity: .95; text-shadow: 0 1px 0 var(--ink), 0 -1px 0 var(--ink), 1px 0 0 var(--ink), -1px 0 0 var(--ink); }
.timer { font-size: 30px; font-variant-numeric: tabular-nums; }
.pos { font-size: 36px; color: var(--gold); min-width: 64px; text-align: right; }
.ctrl { position: absolute; bottom: calc(28px + var(--safe-b)); width: 30vw; max-width: 170px; height: 30vw; max-height: 170px; padding: 6%; color: rgba(255,255,255,.75); filter: drop-shadow(0 3px 0 rgba(0,0,0,.25)); touch-action: none; transition: transform .06s, color .06s; }
.ctrl.left { left: 4vw; } .ctrl.right { right: 4vw; }

.banner { position: absolute; top: 22%; left: 0; right: 0; margin: auto; width: fit-content; font-size: 30px; padding: 8px 22px; border-radius: 16px; background: rgba(10,30,80,.4); animation: pop .4s, fadeout .5s 1.6s forwards; pointer-events: none !important; }
@keyframes fadeout { to { opacity: 0; transform: translateY(-20px); } }
.track { position: absolute; top: calc(78px + var(--safe-t)); left: 0; right: 0; margin: auto; width: min(70vw, 360px); height: 10px; border-radius: 6px; background: rgba(10,30,80,.5); border: 2px solid var(--ink); }
.trackbar { position: absolute; inset: 0; }
.trackbar .dot { position: absolute; top: 50%; width: 16px; height: 16px; margin: -8px 0 0 -8px; border-radius: 50%; border: 2px solid var(--ink); transition: left .15s linear; }
.trackbar .dot:first-child { z-index: 2; width: 20px; height: 20px; margin: -10px 0 0 -10px; }

/* overlays & panels */
.overlay { position: absolute; inset: 0; display: grid; place-items: center; background: rgba(8, 30, 80, .45); backdrop-filter: blur(5px); -webkit-backdrop-filter: blur(5px); animation: fadein .2s; }
.panel { position: relative; width: min(90vw, 400px); padding: 44px 20px 22px; border-radius: 22px; background: linear-gradient(#2f8cff, #155fd8); border: 3px solid var(--ink); box-shadow: 0 0 0 4px #fff, 0 10px 0 4px rgba(0,0,0,.25); animation: pop .4s; }
.ribbon { position: absolute; top: -26px; left: 50%; transform: translateX(-50%); white-space: nowrap; padding: 8px 26px; font-size: 28px; border-radius: 14px; background: linear-gradient(#ff5a6e, #e8334a); border: 3px solid var(--ink); box-shadow: 0 0 0 3px #fff; }

.polaroid { width: min(78vw, 360px); padding: 16px 16px 0; background: #fff; box-shadow: -10px 12px 0 #0b2e66; transform: rotate(-5deg); animation: drop .55s cubic-bezier(.2,1.4,.4,1); }
@keyframes drop { from { transform: rotate(14deg) translateY(-60vh) scale(1.2); } }
.photo { aspect-ratio: 1 / 1.05; background: #19a1ff center / cover; filter: saturate(1.1); }
.caption { padding: 22px 6px 26px; text-align: center; color: #8a92a6; font-size: 26px; font-weight: 700; }
.barbtns { display: flex; gap: 0; border: 3px solid var(--ink); border-radius: 18px; overflow: hidden; box-shadow: 0 0 0 3px #fff, 0 6px 0 3px rgba(0,0,0,.2); animation: slideup .4s .2s backwards; }
.barbtns .btn { border: 0; border-radius: 0; box-shadow: inset 0 -7px 0 rgba(0,0,0,.2); min-height: 82px; flex-direction: column; gap: 2px; font-size: 19px; padding: 0 22px; border-right: 2px solid rgba(0,0,0,.25); }

.star { width: 70px; height: 70px; color: #0b3e8a; filter: drop-shadow(0 3px 0 var(--ink)); }
.star:nth-child(2) { transform: translateY(-14px); width: 82px; height: 82px; }

@keyframes starpop { 0% { transform: scale(0) rotate(-90deg); } 70% { transform: scale(1.3); } }
.rows { margin: 14px 0 6px; }
.row { display: flex; justify-content: space-between; align-items: center; font-size: 20px; padding: 6px 4px; border-bottom: 2px solid rgba(255,255,255,.15); }
.row b { font-variant-numeric: tabular-nums; }
.row.hint { font-size: 13px; opacity: .85; border: 0; justify-content: center; }
.row.hint svg { display: inline-block; width: 13px; height: 13px; vertical-align: -2px; color: var(--gold); }
.new { font-style: normal; color: var(--gold); font-size: 15px; margin-left: 4px; }
.earn { display: flex; align-items: center; justify-content: center; gap: 6px; font-size: 30px; font-weight: 700; margin-top: 8px; color: var(--gold); text-shadow: 0 2px 0 var(--ink); }
.earn .gemi { width: 30px; height: 30px; }
.sub { text-align: center; font-size: 16px; font-weight: 600; opacity: .95; margin-top: 8px; line-height: 1.35; }

/* race */
.cups { position: absolute; top: calc(62px + var(--safe-t)); left: 0; right: 0; display: flex; justify-content: center; gap: 8px; padding: 0 10px; }
.cup { display: flex; flex-direction: column; align-items: center; gap: 2px; width: 82px; padding: 8px 4px; border-radius: 14px; background: rgba(10,30,80,.5); border: 3px solid var(--ink); font-size: 12px; font-weight: 700; text-align: center; }
.cup .ico { width: 34px; height: 34px; color: #6f7894; }

.race.btn, .btn.race { position: absolute; left: 0; right: 0; margin: auto; width: fit-content; bottom: calc(118px + var(--safe-b)); height: 76px; font-size: 36px; min-width: 210px; animation: bob 1.6s ease-in-out infinite; }
.btn.race .ico { width: 44px; height: 44px; }

.trow.p1 { background: linear-gradient(#ffd84a, #f5b000); color: #6b3d00; text-shadow: none; }
.trow.p2 { background: linear-gradient(#dfe3ee, #b5bccd); color: #3c4258; text-shadow: none; }

.medal { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; background: rgba(255,255,255,.4); border: 2px solid rgba(0,0,0,.3); }

.card { flex: none; width: 128px; height: 112px; position: relative; border-radius: 16px; background: linear-gradient(#2f9bff, #0a6fe6); border: 3px solid var(--ink); box-shadow: 0 0 0 3px rgba(255,255,255,.6), inset 0 -6px 0 rgba(0,0,0,.2); scroll-snap-align: center; overflow: hidden; }
.card img { width: 100%; height: 76px; object-fit: contain; display: block; margin-top: 2px; }

.tag.ok { width: 26px; height: 26px; padding: 3px; background: #46d35c; border: 2px solid var(--ink); }
.shopbtn { position: absolute; left: 0; right: 0; bottom: calc(108px + var(--safe-b)); text-align: center; }
.shopbtn .btn { min-width: 200px; }

/* settings */

.toggle { display: flex; align-items: center; gap: 12px; width: 100%; padding: 12px 14px; margin-top: 10px; border-radius: 14px; background: rgba(0,0,0,.18); font-size: 20px; font-weight: 700; }
.toggle .ico { width: 28px; height: 28px; }
.toggle i { margin-left: auto; width: 54px; height: 30px; border-radius: 15px; background: #8e97b0; border: 3px solid var(--ink); position: relative; }
.toggle i::after { content: ''; position: absolute; top: 2px; left: 2px; width: 20px; height: 20px; border-radius: 50%; background: #fff; transition: left .15s; }
