:root {
  --blue: #1d8cff; --blue2: #0a64d6; --blueD: #0b3e8a; --ink: #11131c; --gold: #ffc61a; --orange: #ff8a1f; --red: #ff3d57; --gray: #a7afc4; --gray2: #7d86a0;
  --theme: #1d8cff; --safe-t: env(safe-area-inset-top, 0px); --safe-b: env(safe-area-inset-bottom, 0px);
  color-scheme: light;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
html, body { margin: 0; height: 100%; overflow: hidden; background: #2fb6ff; font-family: 'Fredoka', 'Arial Rounded MT Bold', system-ui, sans-serif; color: #fff; touch-action: none; overscroll-behavior: none; }
#gl { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
#ui { position: fixed; inset: 0; pointer-events: none; }
#boot { position: fixed; inset: 0; display: grid; place-items: center; background: linear-gradient(#2fb6ff, #bff0ff); font: 700 28px sans-serif; }
.screen { position: absolute; inset: 0; pointer-events: none; animation: fadein .25s ease; }
.screen > *, .overlay, .overlay * { pointer-events: auto; }
@keyframes fadein { from { opacity: 0; } }
@keyframes pop { 0% { transform: scale(.4); opacity: 0; } 70% { transform: scale(1.08); } 100% { transform: scale(1); opacity: 1; } }
@keyframes slideup { from { transform: translateY(40px); opacity: 0; } }
@keyframes bob { 50% { transform: translateY(-6px); } }
.stroke, .btn, .logo, .wtitle, .ribbon, .timer, .pos, .count, .banner, .lvtitle, .sname, .pill b { text-shadow: 0 2px 0 var(--ink), 0 -2px 0 var(--ink), 2px 0 0 var(--ink), -2px 0 0 var(--ink), 2px 2px 0 var(--ink), -2px 2px 0 var(--ink), 2px -2px 0 var(--ink), -2px -2px 0 var(--ink), 0 4px 0 var(--ink); }
svg { width: 100%; height: 100%; fill: currentColor; display: block; }
.ico { display: inline-block; width: 1.25em; height: 1.25em; filter: drop-shadow(0 2px 0 var(--ink)); }
.ico.gold { color: var(--gold); }
button { font: inherit; color: inherit; border: 0; background: none; padding: 0; cursor: pointer; }

/* buttons */
.btn { position: relative; display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 58px; padding: 0 22px; border-radius: 16px; font-size: 22px; font-weight: 700; color: #fff;
  border: 3px solid var(--ink); box-shadow: 0 0 0 3px #fff, inset 0 -7px 0 rgba(0,0,0,.22), 0 6px 0 3px rgba(0,0,0,.18); transition: transform .08s; }
.btn:active, .btn.down { transform: translateY(3px) scale(.97); }
.btn.blue { background: linear-gradient(#2f9bff, #0a6fe6); }

.trow .pt { text-align: right; font-size: 22px; }
.medal { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; background: rgba(255,255,255,.4); border: 2px solid rgba(0,0,0,.3); }
.cupbig { width: 110px; height: 110px; margin: -6px auto 10px; color: #8e97b0; filter: drop-shadow(0 4px 0 var(--ink)); }
.cupbig.won { color: var(--gold); animation: pop .6s, bob 1.4s .6s infinite; }
.confetti { position: absolute; top: -20px; width: 10px; height: 16px; border-radius: 2px; animation: conf 2.5s linear forwards; pointer-events: none !important; }
@keyframes conf { to { transform: translate(var(--rx), 110vh) rotate(720deg); } }

/* shop */
.shopinfo { position: absolute; top: calc(60px + var(--safe-t)); left: 16px; right: 16px; text-align: center; }
.sname { font-size: 34px; }
.sdesc { font-size: 16px; font-weight: 600; margin-top: 2px; text-shadow: 0 1px 0 var(--ink); }
.stats { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 14px; width: min(100%, 380px); margin: 10px auto 0; }
.stat { display: flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 700; text-shadow: 0 1px 0 var(--ink); }
.stat span { width: 46px; text-align: left; }
.stat .bar { height: 14px; border-width: 2px; box-shadow: none; }
.stat .bar i { position: absolute; left: 0; top: 0; bottom: 0; background: linear-gradient(#ffd84a, #ff9a14); }
.stat .bar i.up { background: linear-gradient(#7aff8a, #2fc85a); }
.stat .bar { position: relative; }
.pips { position: absolute; inset: 0; display: flex; justify-content: flex-end; gap: 2px; padding: 2px 3px; pointer-events: none; }
.pips em { width: 6px; height: 100%; border-radius: 2px; background: rgba(255,255,255,.25); }
.pips em.on { background: #fff; box-shadow: 0 0 4px #7aff8a; }
.pips em.pop { animation: pop .4s; }
.upbtn { flex: none; min-width: 54px; padding: 2px 6px; border-radius: 8px; font-size: 12px; font-weight: 700; color: #fff; background: linear-gradient(#5ae06a, #2fae4a); border: 2px solid var(--ink); text-shadow: 0 1px 0 var(--ink); }
.upbtn.poor { background: linear-gradient(#9aa2b8, #7a829a); }
.upmax { flex: none; min-width: 54px; text-align: center; font-size: 12px; color: var(--gold); }
.stats.owned { grid-template-columns: 1fr; gap: 5px; width: min(100%, 330px); }
.tag.lvl { left: 4px; right: auto; background: #2fae4a; }
.cards { position: absolute; left: 0; right: 0; bottom: calc(176px + var(--safe-b)); display: flex; gap: 12px; overflow-x: auto; padding: 10px 16px; scroll-snap-type: x mandatory; touch-action: pan-x; }
.card { flex: none; width: 128px; height: 112px; position: relative; border-radius: 16px; background: linear-gradient(#2f9bff, #0a6fe6); border: 3px solid var(--ink); box-shadow: 0 0 0 3px rgba(255,255,255,.6), inset 0 -6px 0 rgba(0,0,0,.2); scroll-snap-align: center; overflow: hidden; }
.card img { width: 100%; height: 76px; object-fit: contain; display: block; margin-top: 2px; }
.card .cn { display: block; font-size: 14px; font-weight: 700; text-shadow: 0 1px 0 var(--ink); }
.card.sel { box-shadow: 0 0 0 4px var(--gold), inset 0 -6px 0 rgba(0,0,0,.2); transform: translateY(-4px); }
.tag { position: absolute; top: 4px; right: 4px; display: flex; align-items: center; gap: 3px; padding: 2px 6px; border-radius: 10px; font-size: 13px; font-weight: 700; background: rgba(10,30,80,.7); }
.tag .gemi { width: 14px; height: 14px; }
.tag.ok { width: 26px; height: 26px; padding: 3px; background: #46d35c; border: 2px solid var(--ink); }
.shopbtn { position: absolute; left: 0; right: 0; bottom: calc(108px + var(--safe-b)); text-align: center; }
.shopbtn .btn { min-width: 200px; }
.shopbtn .gemi { width: 22px; height: 22px; }

/* settings */
.setp { position: absolute; top: max(12%, calc(64px + var(--safe-t))); left: 0; right: 0; margin: auto; }
.toggle { display: flex; align-items: center; gap: 12px; width: 100%; padding: 12px 14px; margin-top: 10px; border-radius: 14px; background: rgba(0,0,0,.18); font-size: 20px; font-weight: 700; }
.toggle .ico { width: 28px; height: 28px; }
.toggle i { margin-left: auto; width: 54px; height: 30px; border-radius: 15px; background: #8e97b0; border: 3px solid var(--ink); position: relative; }
.toggle i::after { content: ''; position: absolute; top: 2px; left: 2px; width: 20px; height: 20px; border-radius: 50%; background: #fff; transition: left .15s; }
.toggle.on i { background: #46d35c; } .toggle.on i::after { left: 26px; }

@media (min-aspect-ratio: 1/1) {
  .wtitle { top: 18%; } .prog { top: calc(18% + 60px); }
  .logo { left: 24px; right: auto; top: calc(14px + var(--safe-t)); font-size: 34px; text-align: left; } .logo .r { font-size: 44px; }
  .wsub, .dots { display: none; }
  .ctrl { width: 18vw; height: 18vw; }
  .cards { bottom: calc(170px + var(--safe-b)); justify-content: center; }
  .racep { top: calc(170px + var(--safe-t)); }
  .fail, .win, .results { flex-direction: row; gap: 40px; }
  .fail .barbtns, .win .barbtns, .results .barbtns { flex-direction: column; }
  .fail .barbtns .btn, .win .barbtns .btn, .results .barbtns .btn { border-right: 0; border-bottom: 2px solid rgba(0,0,0,.25); }
  .polaroid { width: min(42vh, 340px); } .caption { font-size: 20px; padding: 14px 6px 18px; }
}
@media (max-height: 700px) and (max-aspect-ratio: 1/1) {
  .wsub { display: none; } .wcount { bottom: calc(184px + var(--safe-b)); }
  .play, .btn.race { height: 66px; bottom: calc(104px + var(--safe-b)); }
  .btn.rnd { bottom: calc(180px + var(--safe-b)); }
  .setp { top: calc(78px + var(--safe-t)); padding: 34px 16px 12px; } .setp .toggle { padding: 6px 12px; margin-top: 6px; font-size: 16px; } .setp .btn.wide { min-height: 44px; margin-top: 8px; font-size: 18px; } .setp .sub { font-size: 12px; } .setlbl { margin-top: 8px; }
  .nav button { height: 66px; font-size: 14px; } .nav button .ico { width: 28px; height: 28px; }
  .sname { font-size: 26px; } .sdesc { font-size: 13px; } .stats { margin-top: 6px; }
  .cards { bottom: calc(146px + var(--safe-b)); padding: 8px 14px; } .card { width: 108px; height: 94px; } .card img { height: 60px; }
  .shopbtn { bottom: calc(90px + var(--safe-b)); } .shopbtn .btn { min-height: 46px; font-size: 19px; }
  .ctrl { bottom: calc(14px + var(--safe-b)); }
 .logo { display: none; } .wtitle { top: 14%; } .prog { top: calc(14% + 64px); } .racep { top: calc(150px + var(--safe-t)); } }
</style>
